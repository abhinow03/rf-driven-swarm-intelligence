[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-intent"
version = "0.1.0"
description = "LLM-driven semantic RF analysis for UAV swarm communication"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3",
    "matplotlib>=3.7", "seaborn>=0.12", "tqdm>=4.66", "requests>=2.31",
]

[project.optional-dependencies]
# torch / torch-geometric are best installed per-platform; see requirements.txt
finetune = ["transformers>=4.44", "peft>=0.12", "bitsandbytes>=0.43",
            "datasets>=2.20", "accelerate>=0.33", "trl>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]
